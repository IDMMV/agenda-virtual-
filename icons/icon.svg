<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="45%" stop-color="#142850"/>
      <stop offset="85%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <!-- Gold Gradient -->
    <linearGradient id="gpGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Cyan/Blue Glow Gradient -->
    <linearGradient id="gpCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <!-- Emerald Gradient -->
    <linearGradient id="gpEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect width="512" height="512" rx="118" fill="url(#gpBg)"/>
  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Background Geometry Pattern / Star Rays -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(56,189,248,0.08)" stroke-width="2"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(52,211,153,0.08)" stroke-width="2"/>

  <!-- Shield of Discipline & Focus (Safe Area) -->
  <g filter="url(#shadow)">
    <path d="M256 90 L395 145 V260 C395 355 256 425 256 425 C256 425 117 355 117 260 V145 Z" 
          fill="rgba(15,23,42,0.85)" stroke="url(#gpCyan)" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <!-- Growth Dynamic Diagonal Arrow (Financial & Habit Progress) -->
  <path d="M165 330 L320 175" stroke="url(#gpEmerald)" stroke-width="18" stroke-linecap="round"/>
  <path d="M270 175 H325 V230" fill="none" stroke="url(#gpEmerald)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Intertwined Monogram "G" and "P" (Gestión Personal) -->
  <!-- "G" Section (Left Loop) -->
  <path d="M245 195 C190 195 160 230 160 270 C160 315 195 345 245 345 C285 345 305 325 310 295 H245" 
        fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "P" Section (Right Loop) -->
  <path d="M245 195 V345 M245 195 H300 C335 195 350 215 350 242 C350 270 330 288 290 288 H245" 
        fill="none" stroke="url(#gpGold)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center Discipline Spark (Flame of Consistency) -->
  <path d="M256 120 Q272 150 262 170 Q280 155 280 135 Q295 160 275 190 Q255 215 235 190 Q220 170 240 150 Q245 165 252 165 Q256 145 256 120 Z" 
        fill="url(#gpGold)"/>

  <!-- Tiny Gold Star / Coin Accent -->
  <circle cx="375" cy="135" r="24" fill="url(#gpGold)" stroke="#ffffff" stroke-width="4"/>
  <text x="375" y="143" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="20" fill="#0f172a" text-anchor="middle">★</text>
</svg>
